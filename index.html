<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Trăng Hy Vọng Volunteer Form</title>

<style>

/* PAGE */

html,
body {

  height: 100%;

  margin: 0;
  padding: 0;

  display: flex;

  justify-content: center;
  align-items: center;

  background:
    radial-gradient(
      circle,
      #1a0000,
      #000000
    );

  font-family:
    "Lucida Console",
    monospace;

  overflow: hidden;
}

/* MAIN CARD */

.card {

  position: relative;

  width: 900px;
  height: 650px;

  overflow: hidden;

  border: 10px solid #d7000f;

  background:
    linear-gradient(
      45deg,
      #fdee83,
      #fefcea
    );

  box-shadow:
    0 0 25px black;

  filter:
    drop-shadow(
      0 0 20px black
    );
}

/* TITLE */

.card-title {

  position: absolute;

  top: 20px;
  right: 20px;

  writing-mode: vertical-rl;

  font-size: 40px;

  letter-spacing: 10px;

  color: #d7000f;

  opacity: 0.85;

  z-index: 2;
}

/* FORM CONTAINER */

.game-container {

  position: absolute;

  top: 40px;
  left: 40px;

  width: 560px;
  height: 500px;

  overflow: hidden;

  background:
    rgba(0,0,0,0.82);

  border:
    3px solid #d7000f;

  padding: 0;

  box-sizing: border-box;

  z-index: 5;

  box-shadow:
    0 0 15px black;
}

/* GOOGLE FORM */

.volunteer-form {

  width: 100%;
  height: 100%;

  border: none;

  background: white;
}

/* DECORATIVE HILLS */

.card-hill {

  position: absolute;

  bottom: 0;
}

/* LEFT HILL */

.hill-1 {

  width: 250px;
  height: 250px;

  background: #fff;

  border-top:
    10px solid #D9AF64;

  border-right:
    10px solid #D9AF64;

  border-radius:
    0 250px 0 0;
}

/* RIGHT HILL */

.hill-2 {

  right: 0;

  width: 250px;
  height: 250px;

  background: #ffc966;

  border-top:
    10px solid #D9AF64;

  border-left:
    10px solid #D9AF64;

  border-radius:
    250px 0 0 0;
}

/* CENTER HILL */

.hill-3 {

  left: 200px;

  width: 400px;
  height: 180px;

  background: #D7000F;

  border-top:
    10px solid #D9AF64;

  border-radius:
    400px 400px 0 0;
}

</style>

</head>

<body>

<div class="card">

  <!-- TITLE -->

  <div class="card-title">
    TẾT<br>FESTIVAL
  </div>

  <!-- FORM WINDOW -->

  <div class="game-container">

    <iframe
      class="volunteer-form"
      src="https://docs.google.com/forms/d/e/1FAIpQLSeB_ddcjMdQD_f3B6Ppq0FNEjk0cdlVDgiS4ubjn2orNeIjUg/viewform?usp=header"
    >
    </iframe>

  </div>

  <!-- HILLS -->

  <div class="card-hill hill-1"></div>
  <div class="card-hill hill-2"></div>
  <div class="card-hill hill-3"></div>

</div>

</body>
</html>
