<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="X-UA-Compatible"
    content="ie=edge"
  >

  <title>remember the night?</title>

  <link
    rel="stylesheet"
    href="cyoa.css"
  >

</head>

<body>

<div class="card">

  <!-- TITLE -->

  <div class="card-title">
    REMEMBER<br>THE<br>NIGHT
  </div>

  <!-- SEAL -->

  <div class="card-seal"></div>

  <!-- FLOWER 1 -->

  <div class="card-flower-1">

    <div class="card-flower-petal petal-1"></div>
    <div class="card-flower-petal petal-2"></div>
    <div class="card-flower-petal petal-3"></div>
    <div class="card-flower-petal petal-4"></div>
    <div class="card-flower-petal petal-5"></div>

    <div class="card-flower-pollen pollen-1"></div>
    <div class="card-flower-pollen pollen-2"></div>
    <div class="card-flower-pollen pollen-3"></div>
    <div class="card-flower-pollen pollen-4"></div>
    <div class="card-flower-pollen pollen-5"></div>

  </div>

  <!-- FLOWER 2 -->

  <div class="card-flower-2">

    <div class="card-flower-petal petal-1"></div>
    <div class="card-flower-petal petal-2"></div>
    <div class="card-flower-petal petal-3"></div>
    <div class="card-flower-petal petal-4"></div>
    <div class="card-flower-petal petal-5"></div>

    <div class="card-flower-pollen pollen-1"></div>
    <div class="card-flower-pollen pollen-2"></div>
    <div class="card-flower-pollen pollen-3"></div>
    <div class="card-flower-pollen pollen-4"></div>
    <div class="card-flower-pollen pollen-5"></div>

  </div>

  <!-- GAME WINDOW -->

  <div class="game-container">

    <div id="text">
      Text
    </div>

    <div
      id="option-buttons"
      class="btn-grid"
    >
      <button class="btn">
        Option 1
      </button>

      <button class="btn">
        Option 2
      </button>
    </div>

  </div>

  <!-- HILLS -->

  <div class="card-hill hill-1"></div>
  <div class="card-hill hill-2"></div>
  <div class="card-hill hill-3"></div>

</div>

<script>

const textElement =
  document.getElementById('text')

const optionButtonsElement =
  document.getElementById('option-buttons')

let state = {}

function startGame() {

  state = {}

  showTextNode(1)
}

function showTextNode(textNodeIndex) {

  const textNode =
    textNodes.find(
      textNode =>
        textNode.id === textNodeIndex
    )

  textElement.innerText =
    textNode.text

  while (
    optionButtonsElement.firstChild
  ) {

    optionButtonsElement.removeChild(
      optionButtonsElement.firstChild
    )
  }

  textNode.options.forEach(option => {

    if (showOption(option)) {

      const button =
        document.createElement('button')

      button.innerText =
        option.text

      button.classList.add('btn')

      button.addEventListener(
        'click',
        () => selectOption(option)
      )

      optionButtonsElement.appendChild(button)
    }

  })
}

function showOption(option) {

  return (
    option.requiredState == null ||
    option.requiredState(state)
  )
}

function selectOption(option) {

  const nextTextNodeId =
    option.nextText

  if (nextTextNodeId <= 0) {
    return startGame()
  }

  state = Object.assign(
    state,
    option.setState
  )

  showTextNode(nextTextNodeId)
}

const textNodes = [

  {
    id: 1,

    text:
`Your name is Private Cooper.

You emerge from your truck and are assaulted with the stench of smoldering flesh and rancid blood.

A massacre happened here.

"We're splitting the forces between truck Alpha and truck Beta."`,

    options: [

      {
        text: 'Take Truck Alpha',
        nextText: 2
      },

      {
        text: 'Take Truck Beta',
        nextText: 3
      }

    ]
  },

  {
    id: 2,

    text:
`Truck Alpha heads directly toward the flesh wall.

The soldier beside you looks like he's about to throw up.`,

    options: [

      {
        text: '"You okay?"',
        nextText: 4
      },

      {
        text: '"Sorry."',
        nextText: 5
      }

    ]
  },

  {
    id: 3,

    text:
`Truck Beta arrives at Hawkins Memorial Hospital.

Two groups split up — one to Floor 2, one to Floor 3.`,

    options: [

      {
        text: 'Go to Floor 2',
        nextText: 6
      },

      {
        text: 'Go to Floor 3',
        nextText: 7
      }

    ]
  },

  {
    id: 4,

    text:
`"If you knock, someone answers the door."`,

    options: [

      {
        text: 'CONTINUE',
        nextText: 8
      }

    ]
  },

  {
    id: 5,

    text:
`"You'd look like this too if you knew what was coming."`,

    options: [

      {
        text: 'CONTINUE',
        nextText: 8
      }

    ]
  },

  {
    id: 6,

    text:
`The hospital seems strangely secure.`,

    options: [

      {
        text: 'Wander the halls',
        nextText: 9
      },

      {
        text: 'Stay put',
        nextText: 10
      }

    ]
  },

  {
    id: 7,

    text:
`A terrified candystriper paces the hallway.`,

    options: [

      {
        text: 'Talk to her',
        nextText: 21
      },

      {
        text: 'Ignore her',
        nextText: 22
      }

    ]
  },

  {
    id: 8,

    text:
`The monster catches you.

YOU DIED.`,

    options: [

      {
        text: 'Restart',
        nextText: -1
      }

    ]
  }

]

startGame()

</script>

</body>
</html>
