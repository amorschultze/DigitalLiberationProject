<div class="card">

  <!-- TITLE -->

  <div class="card-title">
    REMEMBER<br>THE<br>NIGHT

  <!-- SEAL -->

  <div class="card-seal"></div>

  <!-- FLOWER 1 -->

  <div class="card-flower-1">

    <div class="card-flower-petal petal-1"></div>
    <div class="card-flower-petal petal-2"></div>
    <div class="card-flower-petal petal-3"></div>
    <div class="card-flower-petal petal-4"></div>
    <div class="card-flower-petal petal-5"></div>

    <div class="card-flower-pollen pollen-1"></div>
    <div class="card-flower-pollen pollen-2"></div>
    <div class="card-flower-pollen pollen-3"></div>
    <div class="card-flower-pollen pollen-4"></div>
    <div class="card-flower-pollen pollen-5"></div>

  </div>

  <!-- FLOWER 2 -->

  <div class="card-flower-2">

    <div class="card-flower-petal petal-1"></div>
    <div class="card-flower-petal petal-2"></div>
    <div class="card-flower-petal petal-3"></div>
    <div class="card-flower-petal petal-4"></div>
    <div class="card-flower-petal petal-5"></div>

    <div class="card-flower-pollen pollen-1"></div>
    <div class="card-flower-pollen pollen-2"></div>
    <div class="card-flower-pollen pollen-3"></div>
    <div class="card-flower-pollen pollen-4"></div>
    <div class="card-flower-pollen pollen-5"></div>

  </div>

  <!-- GAME WINDOW -->

  <div class="game-container">

    <div id="text">
      Text
    </div>

    <div
      id="option-buttons"
      class="btn-grid"
    >
      <button class="btn">
        Option 1
      </button>

      <button class="btn">
        Option 2
      </button>
    </div>

  </div>

  <!-- HILLS -->

  <div class="card-hill hill-1"></div>
  <div class="card-hill hill-2"></div>
  <div class="card-hill hill-3"></div>

</div>

<script>

const textElement =
  document.getElementById('text')

const optionButtonsElement =
  document.getElementById('option-buttons')

let state = {}

function startGame() {

  state = {}

  showTextNode(1)
}

function showTextNode(textNodeIndex) {

  const textNode =
    textNodes.find(
      textNode =>
        textNode.id === textNodeIndex
    )

  textElement.innerText =
    textNode.text

  while (
    optionButtonsElement.firstChild
  ) {

    optionButtonsElement.removeChild(
      optionButtonsElement.firstChild
    )
  }

  textNode.options.forEach(option => {

    if (showOption(option)) {

      const button =
        document.createElement('button')

      button.innerText =
        option.text

      button.classList.add('btn')

      button.addEventListener(
        'click',
        () => selectOption(option)
      )

      optionButtonsElement.appendChild(button)
    }

  })
}

function showOption(option) {

  return (
    option.requiredState == null ||
    option.requiredState(state)
  )
}

function selectOption(option) {

  const nextTextNodeId =
    option.nextText

  if (nextTextNodeId <= 0) {
    return startGame()
  }

  state = Object.assign(
    state,
    option.setState
  )

  showTextNode(nextTextNodeId)
}

const textNodes = [

{
  id: 1,

  text:
`Introduction

Today, you’ll be visiting the local Trăng Hy Vọng park with your seven-year-old niece, Hoa.

You’ve been looking forward to this for weeks, and have planned out the perfect day with her: today it’ll be hosting its 30th Vietnamese Tết festival to celebrate Lunar New Years!

You’ve planned a visit to the food stalls, a trip through the lotus gardens, and a small picnic at the duck pond to watch the Lion dances.

Are you excited for this visit?

PS. You may want a piece of paper and pen ready.`,

  options: [

    {
      text: 'Begin the Festival',
      nextText: 2
    }

  ]
},

{
  id: 2,

  text:
`Part 1: Festival Food

Vendors line the walkway with crackling egg rolls, steaming broths, bánh mì, and sweet chè thái.

Hoa bounces excitedly beside you in her pink áo dài.

Puzzle #1:
What does Hoa order?

Rice crepes on skillets
Sizzles with turmeric scents
Prawns, pork, and bean sprouts`,

  options: [

      text: 'Bánh Tráng Nướng',

    {

},

{
  id: 3,

`An elderly man stands over a sizzling skillet making bánh xèo.

Hoa points at a sign on the stall.

“What does this say?” she asks.

“It’s our code to support the park,” the man says sadly.

“There are plans to demolish it for a hotel.”

You suddenly recognize him from your childhood visits here.`,

  options: [

    {

      nextText: 4
    }

  ]
},

{

Puzzle #2:

Hoa grows quiet.

“This may be my last chance to see the lotuses, right?”`,

  options: [

    {

      nextText: 6

},

{
  id: 6,

  text:
`Puzzle #3

Decode the Vietnamese lotus chant.

“No other species in the lake can rival lotuses...”`,

      text: 'Yeah, you’re probably right.',
      nextText: 7

      nextText: 7

  ]
},

{
  id: 7,

  text:
`Hoa brightens and runs toward the lotus pond.

A dragonfly lands briefly on a lotus blossom.

},

{
  id: 8,

  text:
`Part 3: The Lion Dance

You and Hoa rush toward the duck pond for the Lion Dance performance.

A volunteer named Anh approaches with a petition clipboard.

“We need signatures to help save the park.”`,

  options: [

    {
      text: 'Sign the petition',

  ]
},

{
  id: 9,

  text:

Hoa looks determined.

“I want to help save the park forever.”`,

    {

},

{
  id: 10,

`Puzzle #5:

`Puzzle #7

  text:
`“Happy New Year, chúc mừng năm mới!”

“Chúc mừng năm mới, Hoa.”

The drums fade into the evening as the festival lights glow across the water.

Conclusion

Thank you for playing the Lunar New Years escape room.

We hope you gained a deeper appreciation of public parks and Vietnamese cultural traditions.`,

  options: [

    {
      text: 'Play Again',
      nextText: -1

]

startGame()

</script>
