<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    http-equiv="X-UA-Compatible"
    content="ie=edge"
  >

  <title>remember the night?</title>

  <link
    rel="stylesheet"
    href="cyoa.css"
  >

</head>

<body>

<div class="card">

  <!-- TITLE -->

  <div class="card-title">
    REMEMBER<br>THE<br>NIGHT
  </div>

  <!-- SEAL -->

  <div class="card-seal"></div>

  <!-- FLOWER 1 -->

  <div class="card-flower-1">

    <div class="card-flower-petal petal-1"></div>
    <div class="card-flower-petal petal-2"></div>
    <div class="card-flower-petal petal-3"></div>
    <div class="card-flower-petal petal-4"></div>
    <div class="card-flower-petal petal-5"></div>

    <div class="card-flower-pollen pollen-1"></div>
    <div class="card-flower-pollen pollen-2"></div>
    <div class="card-flower-pollen pollen-3"></div>
    <div class="card-flower-pollen pollen-4"></div>
    <div class="card-flower-pollen pollen-5"></div>

  </div>

  <!-- FLOWER 2 -->

  <div class="card-flower-2">

    <div class="card-flower-petal petal-1"></div>
    <div class="card-flower-petal petal-2"></div>
    <div class="card-flower-petal petal-3"></div>
    <div class="card-flower-petal petal-4"></div>
    <div class="card-flower-petal petal-5"></div>

    <div class="card-flower-pollen pollen-1"></div>
    <div class="card-flower-pollen pollen-2"></div>
    <div class="card-flower-pollen pollen-3"></div>
    <div class="card-flower-pollen pollen-4"></div>
    <div class="card-flower-pollen pollen-5"></div>

  </div>

  <!-- GAME WINDOW -->

  <div class="game-container">

    <div id="text">
      Text
    </div>

    <div
      id="option-buttons"
      class="btn-grid"
    >
      <button class="btn">
        Option 1
      </button>

      <button class="btn">
        Option 2
      </button>
    </div>

  </div>

  <!-- HILLS -->

  <div class="card-hill hill-1"></div>
  <div class="card-hill hill-2"></div>
  <div class="card-hill hill-3"></div>

</div>

<script>

const textElement =
  document.getElementById('text')

const optionButtonsElement =
  document.getElementById('option-buttons')

let state = {}

function startGame() {

  state = {}

  showTextNode(1)
}

function showTextNode(textNodeIndex) {

  const textNode =
    textNodes.find(
      textNode =>
        textNode.id === textNodeIndex
    )

  textElement.innerText =
    textNode.text

  while (
    optionButtonsElement.firstChild
  ) {

    optionButtonsElement.removeChild(
      optionButtonsElement.firstChild
    )
  }

  textNode.options.forEach(option => {

    if (showOption(option)) {

      const button =
        document.createElement('button')

      button.innerText =
        option.text

      button.classList.add('btn')

      button.addEventListener(
        'click',
        () => selectOption(option)
      )

      optionButtonsElement.appendChild(button)
    }

  })
}

function showOption(option) {

  return (
    option.requiredState == null ||
    option.requiredState(state)
  )
}

function selectOption(option) {

  const nextTextNodeId =
    option.nextText

  if (nextTextNodeId <= 0) {
    return startGame()
  }

  state = Object.assign(
    state,
    option.setState
  )

  showTextNode(nextTextNodeId)
}

const textNodes = [

  {
    id: 1,

    text:
`Today, you’ll be visiting the local Trăng Hy Vọng park with your seven-year-old niece, Hoa. You’ve been looking forward to this for weeks, and have planned out the perfect day with her: today it’ll be hosting its 30th Vietnamese Tết festival to celebrate Lunar New Years! You’ve planned a visit to the food stalls, a trip through the lotus gardens, and a small picnic at the duck pond to watch the Lion dances.

Are you excited for this visit? Keep going to see what happens next!

PS. I encourage you to look up some of these terms to discover new foods, clothing items, and plants! It may also help to have a piece of paper and pen at the ready. Good luck!`,

    options: [

      {
        text: 'Let's Go!',
        nextText: 2
      },

  {
    id: 2,

    text:
`When you arrive at the local park, things are in full swing. Vendors line the main walkway with all kinds of Vietnamese foods — crackling egg rolls, rice paper dipped in bowls of water and rolled around pork and lettuce and noodles, steaming vats of red and clear broths, and creamy spreads on pate on bánh mì— while Lion Dancer drums beat off in the distance. There’s a cool breeze in the air, stirring the silk hem of your silk pants and pulling you back to a weekend twenty years ago, when you stood here for the first time.

You were six years old, and this was the tenth annual Tết festival of Trăng Hy Vọng. You remember licking sticky rice off your fingers, biting into a chunk of spongy, brown bánh bò nướng to reveal the bright green color of its interior, slotting a shiny, red envelope into the mouth of a Lion dancer.

Hoa bounces up and down in her pink áo dài and khăn đóng, eyes sparkling as she strides through the stalls. You break from your reverie to follow after her, where she takes her time examining the bowls of milky chè thái and simmering pots of phở before finally finding one she likes, her small hand dragging you to the stall. Although you’ve brought some snacks for the picnic later, you know Hoa’s been excited about trying the festival food as her main dish.

Puzzle 1: What does Hoa order? Decipher this haiku to find out:

Rice crepes on skillets
Sizzles with turmeric scents
Prawns, pork, and bean sprouts`,

    options: [

      {
        text: 'Bún Bò Huế',
        nextText: 4
      },

      {
        text: 'Bánh Tráng Nướng',
        nextText: 5
      }

       {
        text: 'Bánh Mì',
        nextText: 6
      }
      
       {
        text: 'Bánh Xèo',
        nextText: 7
      }

       {
        text: 'Bún Thịt Nướng',
        nextText: 8
      }
      
    ]
  },

  {
    id: 3,

    text:
`An elderly man is standing at his skillet, a thin layer of rice pancake sizzling with smoke for bánh xèo, which you know is Hoa’s favorite. He smiles at her as you order a pork and shrimp and his face looks vaguely familiar, but before you can place it Hoa is pointing to a sign on his stall.

“What does this say…” She asks, squinting at the sign. The man’s name is written on top. “Ông Minh?” You translate for her.

“That’s our code to support the park,” he responds in Vietnamese.

Hoa can’t speak much, but she can understand it. You and her exchange a confused glance. “What do you mean?”

“There are plans to have it demolished for a hotel.”

“Demolished? But this park’s been here for fifty years. We even have the Saigon Wishing Fountain.”

“I know,” the man said sadly, his eyes fixed in the distance. “I remember when they built this park. I had just immigrated to the US, and in two years I was running my stall here.”`,

    options: [

      {
        text: '“Wait!”',
        nextText: 6
      },

    ]
  },

  {
    id: 4,

    text:
``,

    options: [

      {
        text: 'CONTINUE',
        nextText: 8
      }

    ]
  },

  {
    id: 5,

    text:
`"You'd look like this too if you knew what was coming."`,

    options: [

      {
        text: 'CONTINUE',
        nextText: 8
      }

    ]
  },

  {
    id: 6,

    text:
`The hospital seems strangely secure.`,

    options: [

      {
        text: 'Wander the halls',
        nextText: 9
      },

      {
        text: 'Stay put',
        nextText: 10
      }

    ]
  },

  {
    id: 7,

    text:
`A terrified candystriper paces the hallway.`,

    options: [

      {
        text: 'Talk to her',
        nextText: 21
      },

      {
        text: 'Ignore her',
        nextText: 22
      }

    ]
  },

  {
    id: 8,

    text:
`The monster catches you.

YOU DIED.`,

    options: [

      {
        text: 'Restart',
        nextText: -1
      }

    ]
  }

]

startGame()

</script>

</body>
</html>
