<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Tết at Trăng Hy Vọng</title>

<link
  rel="stylesheet"
  href="cyoa.css"
>

</head>

<body>

<div class="card">

  <!-- TITLE -->

  <div class="card-title">
    TẾT<br>FESTIVAL
  </div>

  <!-- GAME WINDOW -->

  <div class="game-container">

    <div id="text"></div>

    <div id="hint"></div>

    <div
      id="option-buttons"
      class="btn-grid"
    ></div>

  </div>

  <!-- HILLS -->

  <div class="card-hill hill-1"></div>
  <div class="card-hill hill-2"></div>
  <div class="card-hill hill-3"></div>

</div>

<script>

const textElement =
  document.getElementById('text')

const optionButtonsElement =
  document.getElementById('option-buttons')

const hintElement =
  document.getElementById('hint')

let state = {}

let previousNodeId = null

function startGame() {

  state = {}

  previousNodeId = null

  showTextNode(1)
}

function showTextNode(textNodeIndex) {

  const textNode =
    textNodes.find(
      textNode =>
        textNode.id === textNodeIndex
    )

  textElement.innerHTML =
    textNode.text

  hintElement.innerHTML = ''

  while (
    optionButtonsElement.firstChild
  ) {

    optionButtonsElement.removeChild(
      optionButtonsElement.firstChild
    )
  }

  textNode.options.forEach(option => {

    const button =
      document.createElement('button')

    button.innerText =
      option.text

    button.classList.add('btn')

    button.addEventListener(
      'click',
      () => selectOption(option, textNode.id)
    )

    optionButtonsElement.appendChild(button)

  })
}

function selectOption(option, currentNodeId) {

  /*
    WRONG ANSWER SYSTEM
    Later you can add:

    wrong: true,
    hint: 'Try looking at the haiku again.'

  */

  if (option.wrong) {

    hintElement.innerHTML =
      option.hint

    showTextNode(currentNodeId)

    return
  }

  previousNodeId = currentNodeId

  if (option.nextText <= 0) {
    return startGame()
  }

  showTextNode(option.nextText)
}

const textNodes = [

/* INTRO */

{
  id: 1,

  text:
`<h2>Introduction</h2>

<p>
Today, you’ll be visiting the local Trăng Hy Vọng park with your seven-year-old niece, Hoa. You’ve been looking forward to this for weeks, and have planned out the perfect day with her: today it’ll be hosting its 30th Vietnamese Tết festival to celebrate Lunar New Years! You’ve planned a visit to the food stalls, a trip through the lotus gardens, and a small picnic at the duck pond to watch the Lion dances.
</p>

<p>
Are you excited for this visit? Keep going to see what happens next!
</p>

<p>
PS. I encourage you to look up some of these terms to discover new foods, clothing items, and plants! It may also help to have a piece of paper and pen at the ready. Good luck!
</p>`,

  options: [
    {
      text: 'Begin the Festival',
      nextText: 2
    }
  ]
},

/* SECTION 1 */

{
  id: 2,

  text:
`<h2>Part 1: Festival Food</h2>

<p>
When you arrive at the local park, things are in full swing. Vendors line the main walkway with all kinds of Vietnamese foods — crackling egg rolls, rice paper dipped in bowls of water and rolled around pork and lettuce and noodles, steaming vats of red and clear broths, and creamy spreads on pate on bánh mì— while Lion Dancer drums beat off in the distance.
</p>

<p>
There’s a cool breeze in the air, stirring the silk hem of your silk pants and pulling you back to a weekend twenty years ago, when you stood here for the first time.
</p>

<p>
You were six years old, and this was the tenth annual Tết festival of Trăng Hy Vọng.
</p>

<p>
You remember licking sticky rice off your fingers, biting into a chunk of spongy, brown bánh bò nướng to reveal the bright green color of its interior, slotting a shiny, red envelope into the mouth of a Lion dancer.
</p>

<p>
Hoa bounces up and down in her pink áo dài and khăn đóng, eyes sparkling as she strides through the stalls.
</p>

<p>
Puzzle 1: What does Hoa order?
</p>

<p>
Rice crepes on skillets<br>
Sizzles with turmeric scents<br>
Prawns, pork, and bean sprouts
</p>`,

  options: [

    {
      text: 'Bún Bò Huế',
      nextText: 3
    },

    {
      text: 'Bánh Tráng Nướng',
      nextText: 3
    },

    {
      text: 'Bánh Mì',
      nextText: 3
    },

    {
      text: 'Bánh Xèo',
      nextText: 3
    },

    {
      text: 'Bún Thịt Nướng',
      nextText: 3
    }

  ]
},

/* SECTION 2 */

{
  id: 3,

  text:
`<h2>Section 2</h2>

<p>
An elderly man is standing at his skillet, a thin layer of rice pancake sizzling with smoke for bánh xèo, which you know is Hoa’s favorite.
</p>

<p>
He smiles at her as you order a pork and shrimp and his face looks vaguely familiar.
</p>

<p>
“What does this say…” she asks.
</p>

<p>
“That’s our code to support the park,” he responds in Vietnamese.
</p>

<p>
“There are plans to have it demolished for a hotel.”
</p>

<p>
“Demolished? But this park’s been here for fifty years.”
</p>`,

  options: [
    {
      text: 'Continue',
      nextText: 4
    }
  ]
},

/* SECTION 3 */

{
  id: 4,

  text:
`<h2>Section 3</h2>

<p>
“Wait!” You exclaim. “That’s where I recognize you. I used to come here as a kid!”
</p>

<p>
The man smiles sadly.
</p>

<p>
“But without this park, I don’t have the permits to run my stall anywhere else.”
</p>

<p>
Puzzle #2: Unscramble the letters on the flyer to spell out the organization.
</p>`,

  options: [

    {
      text: 'People of Saigon',
      nextText: 5
    },

    {
      text: 'Trăng Hy Vọng Organization',
      nextText: 5
    },

    {
      text: 'Vietnamese People of Orange County',
      nextText: 5
    },

    {
      text: 'Settlers of a New Moon',
      nextText: 5
    }

  ]
},

/* LOTUS */

{
  id: 5,

  text:
`<h2>Part 2: Lotus Garden</h2>

<p>
You and Hoa slowly begin to make your way around the gardens.
</p>

<p>
There are ombre white frangipani, yellow hibiscuses, purple crown flowers and spider lilies.
</p>

<p>
“I am,” Hoa says quietly, “but this may be my last chance to see them, right?”
</p>

<p>
Puzzle #3: What can you say in response?
</p>`,

  options: [

    {
      text: 'We can still make our voices be heard.',
      nextText: 6
    },

    {
      text: 'All life comes to an end.',
      nextText: 6
    },

    {
      text: 'Best to take photos while we can.',
      nextText: 6
    },

    {
      text: 'Let’s have faith someone will help.',
      nextText: 6
    }

  ]
},

/* LOTUS POND */

{
  id: 6,

  text:
`<h2>Section 5</h2>

<p>
Hoa grabs you by the hand and rushes toward the Lotus pond.
</p>

<p>
A statue of a water buffalo stands in the center.
</p>

<p>
Puzzle #4: Why is the buffalo important to Vietnamese culture?
</p>`,

  options: [

    {
      text: 'Pillar of the home',
      nextText: 7
    },

    {
      text: 'Spiritual beliefs',
      nextText: 7
    },

    {
      text: 'Legends and myths',
      nextText: 7
    },

    {
      text: 'Agricultural heritage',
      nextText: 7
    },

    {
      text: 'All of the above',
      nextText: 7
    }

  ]
},

/* LION DANCE */

{
  id: 7,

  text:
`<h2>Part 3: The Lion Dance</h2>

<p>
You and Hoa rush toward the duck ponds.
</p>

<p>
A young woman named Anh approaches with a petition clipboard.
</p>

<p>
Puzzle #5: Which organization can help save the park?
</p>`,

  options: [

    {
      text: 'California Environmental Quality Act (CEQA)',
      nextText: 8
    },

    {
      text: 'State Office of Historic Preservation',
      nextText: 8
    },

    {
      text: 'Landmark THIS!',
      nextText: 8
    },

    {
      text: 'City’s Cultural Heritage Commission',
      nextText: 8
    }

  ]
},

/* MOONCAKES */

{
  id: 8,

  text:
`<h2>Section 8</h2>

<p>
You unwrap the picnic snacks.
</p>

<p>
Puzzle #6: What is Hoa excited about?
</p>`,

  options: [

    {
      text: 'Bánh Đậu Xanh',
      nextText: 9
    },

    {
      text: 'Chè Thái',
      nextText: 9
    },

    {
      text: 'Bánh Trung Thu',
      nextText: 9
    },

    {
      text: 'Bánh Chưng',
      nextText: 9
    }

  ]
},

/* FINAL */

{
  id: 9,

  text:
`<h2>Final Scene</h2>

<p>
The lion dancers march through the park.
</p>

<p>
Hoa places her lì xì into the lion’s mouth.
</p>

<p>
Puzzle #7: Decode the message.
</p>`,

  options: [

    {
      text: 'chuc mung nam moi',
      nextText: 10
    }

  ]
},

/* GOING HOME */

{
  id: 10,

  text:
`<h2>Conclusion</h2>

<p>
“Happy New Year, chúc mừng năm mới!”
</p',

  options: [

 {
      text: 'Continue',
      nextText: 11
    }

  ]
},

/* GOING HOME */

{
  id: 11,

  text:
<p>
Thank you for playing the Lunar New Years escape room.
</p>

<p>
Please continue to support your local parks and advocate for their continued maintenance.
</p>`,

  options: [

    {
      text: 'Play Again',
      nextText: -1
    }

  ]
}

]

startGame()

</script>

</body>
</html>
